services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_PATH: /data/db.sqlite
      EXPORT_DIR: /data/exports
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - dbdata:/data
      - exportsdata:/data/exports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dbdata:
  exportsdata:
